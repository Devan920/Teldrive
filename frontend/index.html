<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TelDrive - Virtual Cloud Storage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    };
  </script>
  <style>
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-slide-up {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-modal {
      background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-indigo-500/30 selection:text-indigo-200 relative overflow-x-hidden flex flex-col pb-20" style="padding-top: env(safe-area-inset-top);">

  <!-- Pull To Refresh Indicator -->
  <div id="ptrIndicator" class="fixed top-2 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-200">
    <div class="glass-panel px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 border border-white/20 text-xs font-medium text-indigo-300">
      <svg id="ptrSpinner" class="w-4 h-4 animate-spin text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h5M20 20v-5h-5M4 9a9 9 0 0114.85-3.36L20 7M4 17l1.15-1.36A9 9 0 0120 15"/></svg>
      <span>Pull to refresh</span>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- Background Glow Accents -->
  <div class="fixed -top-40 -left-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed top-1/3 -right-40 w-96 h-96 bg-purple-600/15 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top Search Header -->
  <header class="sticky top-0 z-30 px-4 pt-3 pb-2 space-y-3 glass-panel border-b border-white/10">
    <div class="glass-panel p-2 rounded-full flex items-center gap-3 shadow-lg border border-white/10">
      <button id="btnHamburger" class="p-1.5 text-slate-400 hover:text-white rounded-full hover:bg-white/5 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <label for="searchInput" class="sr-only">Search in TelDrive</label>
      <input type="text" id="searchInput" aria-label="Search in TelDrive" placeholder="Search in TelDrive" class="flex-1 bg-transparent text-slate-100 placeholder-slate-400 text-sm focus:outline-none" />
      <button id="btnClearSearch" class="hidden text-xs text-slate-400 hover:text-white px-2 py-1 rounded bg-white/5">Clear</button>
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-xs font-bold text-white shadow-md border border-white/20 shrink-0">
        TD
      </div>
    </div>

    <!-- Header Title Bar -->
    <div class="flex items-center justify-between px-2 text-sm font-medium text-slate-400">
      <h2 id="currentNavTitle" class="text-base font-bold text-white flex items-center gap-2">
        <span>My Drive</span>
      </h2>
      <div class="flex items-center gap-2">
        <button id="btnToggleView" class="p-1.5 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition" title="Toggle Layout">
          <svg id="viewGridIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          <svg id="viewListIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button id="btnHeaderRefresh" class="p-1.5 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition" title="Refresh">
          <svg id="refreshIcon" class="w-4 h-4 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h5M20 20v-5h-5M4 9a9 9 0 0114.85-3.36L20 7M4 17l1.15-1.36A9 9 0 0120 15"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-4 space-y-4">

    <!-- Folder Navigation Back Sub-Header -->
    <div id="folderSubHeader" class="hidden flex items-center justify-between px-1 bg-white/5 p-2.5 rounded-xl border border-white/10">
      <button id="btnBackFolder" class="text-xs text-indigo-400 font-medium hover:underline flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        <span id="folderBackText">Back to Folders</span>
      </button>
      <span id="folderNameDisplay" class="text-xs font-semibold text-slate-200 truncate">Folder View</span>
    </div>

    <!-- Upload Progress Modal / Container -->
    <div id="progressContainer" class="space-y-3"></div>

    <!-- Hidden File Inputs -->
    <input type="file" id="fileInput" multiple class="hidden" />
    <input type="file" id="folderInput" webkitdirectory directory multiple class="hidden" />

    <!-- Folders Section (Displayed ONLY on Root Files Tab) -->
    <div id="foldersSection" class="space-y-2.5 hidden">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-1">Folders</h2>
      <div id="foldersGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
        <!-- Folder cards -->
      </div>
    </div>

    <!-- Files Section -->
    <div id="filesSection" class="space-y-2.5">
      <h2 id="filesSectionTitle" class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-1">Files</h2>

      <!-- Grid View Container (Default: 2 Columns) -->
      <div id="filesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
        <!-- Dynamic Cards -->
      </div>

      <!-- List View Container (Toggled via button) -->
      <div id="filesList" class="hidden glass-panel rounded-2xl overflow-hidden divide-y divide-white/5">
        <!-- Dynamic Rows -->
      </div>

      <div id="emptyFilesState" class="hidden glass-panel rounded-2xl p-12 text-center text-slate-500 text-sm">
        No items found.
      </div>
    </div>

  </main>

  <!-- Expanded Speed-Dial Floating Action Menu (FAB) -->
  <div id="fabMenuContainer" class="fixed bottom-20 right-5 z-40 flex flex-col items-end gap-3 pointer-events-none">

    <!-- Speed Dial Options -->
    <div id="fabOptions" class="flex flex-col items-end gap-2.5 opacity-0 translate-y-4 pointer-events-none transition-all duration-200">
      <button id="btnFabCreateFolder" class="glass-panel text-xs text-slate-100 font-medium px-4 py-2.5 rounded-2xl border border-white/15 shadow-2xl flex items-center gap-2 hover:bg-slate-800 transition">
        <span>Create Folder</span>
        <span class="w-7 h-7 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
        </span>
      </button>

      <button id="btnFabUploadFile" class="glass-panel text-xs text-slate-100 font-medium px-4 py-2.5 rounded-2xl border border-white/15 shadow-2xl flex items-center gap-2 hover:bg-slate-800 transition">
        <span>Upload Single File</span>
        <span class="w-7 h-7 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
        </span>
      </button>

      <button id="btnFabUploadFolder" class="glass-panel text-xs text-slate-100 font-medium px-4 py-2.5 rounded-2xl border border-white/15 shadow-2xl flex items-center gap-2 hover:bg-slate-800 transition">
        <span>Upload as Folder</span>
        <span class="w-7 h-7 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        </span>
      </button>
    </div>

    <!-- Main FAB Trigger Button -->
    <button id="btnFabMain" class="pointer-events-auto w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-400 text-slate-950 flex items-center justify-center shadow-2xl shadow-amber-500/30 hover:scale-105 active:scale-95 transition-all border border-amber-300/40" title="Actions Menu">
      <svg id="fabPlusIcon" class="w-7 h-7 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
    </button>

  </div>

  <!-- Restructured 3-Tab Bottom Navigation Bar (Home / Starred / Files) -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 glass-panel border-t border-white/10 px-8 py-2.5 flex items-center justify-around text-xs text-slate-400">
    <button id="navHome" class="flex flex-col items-center gap-1 hover:text-indigo-400 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Home</span>
    </button>
    <button id="navStarred" class="flex flex-col items-center gap-1 hover:text-indigo-400 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
      <span>Starred</span>
    </button>
    <button id="navFiles" class="flex flex-col items-center gap-1 text-indigo-400 font-semibold">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
      <span>Files</span>
    </button>
  </nav>

  <!-- Create Folder Modal -->
  <div id="newFolderModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-modal animate-fade-in rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-white/10">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold text-white">Create New Folder</h3>
        <button id="btnCloseFolderModal" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>
      <div>
        <label for="folderNameInput" class="block text-xs font-medium text-slate-300 mb-1.5">Folder Name</label>
        <input type="text" id="folderNameInput" placeholder="e.g. Work Documents" class="w-full bg-slate-900/80 border border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500/80" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button id="btnCancelFolder" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-white/5 transition">Cancel</button>
        <button id="btnSubmitFolder" class="px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-500/20 transition">Create Folder</button>
      </div>
    </div>
  </div>

  <!-- Full-Featured Media Preview Modal -->
  <div id="previewModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-2xl z-50 flex items-center justify-center p-2 sm:p-6 hidden">
    <div class="glass-modal animate-slide-up rounded-2xl max-w-5xl w-full max-h-[92vh] flex flex-col shadow-2xl border border-white/15 overflow-hidden">

      <!-- Modal Header -->
      <div class="px-5 py-4 border-b border-white/10 flex items-center justify-between gap-4 bg-slate-900/60">
        <div class="flex items-center gap-3 overflow-hidden">
          <div id="previewHeaderIcon" class="w-9 h-9 rounded-lg bg-indigo-500/10 flex items-center justify-center text-indigo-400 shrink-0">
            <!-- Dynamic icon -->
          </div>
          <div class="overflow-hidden">
            <h3 id="previewHeaderTitle" class="text-sm sm:text-base font-semibold text-white truncate">File Name</h3>
            <p id="previewHeaderSub" class="text-xs text-slate-400 truncate">Size: 0 MB</p>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <a id="btnPreviewDownload" href="#" download class="bg-emerald-600/80 hover:bg-emerald-500 active:scale-95 text-white text-xs sm:text-sm font-medium px-3.5 py-2 rounded-xl border border-emerald-400/30 shadow-lg shadow-emerald-500/20 transition-all flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <span class="hidden sm:inline">Download</span>
          </a>
          <button id="btnClosePreview" class="text-slate-400 hover:text-white p-2 rounded-full hover:bg-white/10 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <!-- Modal Content Body -->
      <div id="previewBody" class="flex-1 p-4 sm:p-6 overflow-y-auto flex items-center justify-center min-h-[300px]">
        <!-- Dynamic content: Lightbox / Custom Audio / Video / PDF iFrame / Fallback -->
      </div>
    </div>
  </div>

  <script>
    // App State
    let currentTab = 'files'; // 'home', 'starred', 'files'
    let currentFolderId = null;
    let currentFolderName = '';
    let currentSearch = '';
    let currentFiles = [];
    let isGridView = true;
    let isFabOpen = false;
    let activeUploadsCount = 0;

    // Refresh / Navigation Guard for Active Uploads
    window.addEventListener('beforeunload', (e) => {
      if (activeUploadsCount > 0) {
        e.preventDefault();
        e.returnValue = 'Upload in progress! Are you sure you want to exit?';
        return e.returnValue;
      }
    });

    // DOM Elements
    const fileInput = document.getElementById('fileInput');
    const folderInput = document.getElementById('folderInput');
    const progressContainer = document.getElementById('progressContainer');
    const filesSection = document.getElementById('filesSection');
    const filesGrid = document.getElementById('filesGrid');
    const filesList = document.getElementById('filesList');
    const emptyFilesState = document.getElementById('emptyFilesState');
    const foldersSection = document.getElementById('foldersSection');
    const foldersGrid = document.getElementById('foldersGrid');
    const breadcrumbContainer = document.getElementById('breadcrumbContainer');
    const folderSubHeader = document.getElementById('folderSubHeader');
    const btnBackFolder = document.getElementById('btnBackFolder');
    const folderNameDisplay = document.getElementById('folderNameDisplay');

    const searchInput = document.getElementById('searchInput');
    const btnClearSearch = document.getElementById('btnClearSearch');
    const btnHeaderRefresh = document.getElementById('btnHeaderRefresh');
    const refreshIcon = document.getElementById('refreshIcon');
    const btnToggleView = document.getElementById('btnToggleView');
    const viewGridIcon = document.getElementById('viewGridIcon');
    const viewListIcon = document.getElementById('viewListIcon');
    const currentNavTitle = document.getElementById('currentNavTitle');
    const filesSectionTitle = document.getElementById('filesSectionTitle');

    // FAB Elements
    const btnFabMain = document.getElementById('btnFabMain');
    const fabPlusIcon = document.getElementById('fabPlusIcon');
    const fabOptions = document.getElementById('fabOptions');
    const btnFabCreateFolder = document.getElementById('btnFabCreateFolder');
    const btnFabUploadFile = document.getElementById('btnFabUploadFile');
    const btnFabUploadFolder = document.getElementById('btnFabUploadFolder');

    // Bottom Navigation Buttons
    const navHome = document.getElementById('navHome');
    const navStarred = document.getElementById('navStarred');
    const navFiles = document.getElementById('navFiles');

    // New Folder Modal
    const newFolderModal = document.getElementById('newFolderModal');
    const folderNameInput = document.getElementById('folderNameInput');
    const btnCloseFolderModal = document.getElementById('btnCloseFolderModal');
    const btnCancelFolder = document.getElementById('btnCancelFolder');
    const btnSubmitFolder = document.getElementById('btnSubmitFolder');

    // Media Preview Modal
    const previewModal = document.getElementById('previewModal');
    const previewBody = document.getElementById('previewBody');
    const previewHeaderIcon = document.getElementById('previewHeaderIcon');
    const previewHeaderTitle = document.getElementById('previewHeaderTitle');
    const previewHeaderSub = document.getElementById('previewHeaderSub');
    const btnPreviewDownload = document.getElementById('btnPreviewDownload');
    const btnClosePreview = document.getElementById('btnClosePreview');

    // FAB Menu Controller
    function toggleFabMenu(open) {
      isFabOpen = (open !== undefined) ? open : !isFabOpen;
      if (isFabOpen) {
        fabOptions.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
        fabOptions.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
        fabPlusIcon.classList.add('rotate-45');
      } else {
        fabOptions.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
        fabOptions.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
        fabPlusIcon.classList.remove('rotate-45');
      }
    }

    btnFabMain.onclick = (e) => {
      e.stopPropagation();
      toggleFabMenu();
    };

    document.addEventListener('click', (e) => {
      if (isFabOpen && !e.target.closest('#fabMenuContainer')) {
        toggleFabMenu(false);
      }
    });

    btnFabCreateFolder.onclick = () => {
      toggleFabMenu(false);
      folderNameInput.value = '';
      newFolderModal.classList.remove('hidden');
      folderNameInput.focus();
    };

    btnFabUploadFile.onclick = () => {
      toggleFabMenu(false);
      fileInput.click();
    };

    btnFabUploadFolder.onclick = () => {
      toggleFabMenu(false);
      folderInput.click();
    };

    // Navigation Tab Controller
    function switchTab(tab) {
      currentTab = tab;
      currentFolderId = null;
      currentFolderName = '';

      navHome.className = 'flex flex-col items-center gap-1 transition ' + (tab === 'home' ? 'text-indigo-400 font-semibold' : 'text-slate-400 hover:text-indigo-400');
      navStarred.className = 'flex flex-col items-center gap-1 transition ' + (tab === 'starred' ? 'text-amber-400 font-semibold' : 'text-slate-400 hover:text-amber-400');
      navFiles.className = 'flex flex-col items-center gap-1 transition ' + (tab === 'files' ? 'text-indigo-400 font-semibold' : 'text-slate-400 hover:text-indigo-400');

      folderSubHeader.classList.add('hidden');

      if (tab === 'home') {
        currentNavTitle.innerText = 'Home (All Files)';
        foldersSection.classList.add('hidden');
        filesSection.classList.remove('hidden');
        filesSectionTitle.innerText = 'All Files';
      } else if (tab === 'starred') {
        currentNavTitle.innerText = 'Starred Files';
        foldersSection.classList.add('hidden');
        filesSection.classList.remove('hidden');
        filesSectionTitle.innerText = 'Starred Items';
      } else {
        currentNavTitle.innerText = 'My Drive';
        filesSectionTitle.innerText = 'Files';
      }

      loadDriveData();
    }

    navHome.onclick = () => switchTab('home');
    navStarred.onclick = () => switchTab('starred');
    navFiles.onclick = () => switchTab('files');

    btnBackFolder.onclick = () => {
      currentFolderId = null;
      currentFolderName = '';
      folderSubHeader.classList.add('hidden');
      loadDriveData();
    };

    // View Switcher
    btnToggleView.onclick = () => {
      isGridView = !isGridView;
      if (isGridView) {
        filesGrid.classList.remove('hidden');
        filesList.classList.add('hidden');
        viewGridIcon.classList.remove('hidden');
        viewListIcon.classList.add('hidden');
      } else {
        filesGrid.classList.add('hidden');
        filesList.classList.remove('hidden');
        viewGridIcon.classList.add('hidden');
        viewListIcon.classList.remove('hidden');
      }
      renderFilesUI(currentFiles);
    };

    // Toast Notification System
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');

      let bgColors = 'bg-slate-900/90 border-slate-700 text-slate-100';
      let iconSvg = `<svg class="w-4 h-4 text-indigo-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;

      if (type === 'success') {
        bgColors = 'bg-slate-900/90 border-emerald-500/50 text-emerald-200';
        iconSvg = `<svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
      } else if (type === 'error') {
        bgColors = 'bg-slate-900/90 border-rose-500/50 text-rose-200';
        iconSvg = `<svg class="w-4 h-4 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>`;
      }

      toast.className = `glass-panel ${bgColors} px-4 py-3 rounded-xl border shadow-xl flex items-center gap-2.5 text-xs font-medium animate-fade-in transition-all duration-300 pointer-events-auto`;
      toast.innerHTML = `${iconSvg} <span>${message}</span>`;

      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Formatters
    function formatSize(bytes) {
      if (!bytes || bytes <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
    }

    function formatSpeed(bytesPerSec) {
      if (!bytesPerSec || bytesPerSec <= 0) return '0 KB/s';
      if (bytesPerSec >= 1024 * 1024) {
        return (bytesPerSec / (1024 * 1024)).toFixed(1) + ' MB/s';
      }
      return (bytesPerSec / 1024).toFixed(0) + ' KB/s';
    }

    // Load Data
    function loadDriveData() {
      refreshIcon.classList.add('rotate-180');
      setTimeout(() => refreshIcon.classList.remove('rotate-180'), 600);

      if (currentTab === 'files') {
        loadFolders();
      }
      loadFiles();
    }

    function loadFiles() {
      let url = '/files';
      const params = new URLSearchParams();

      if (currentSearch) {
        params.append('search', currentSearch);
      } else if (currentTab === 'home') {
        params.append('all_files', 'true');
      } else if (currentTab === 'starred') {
        params.append('is_starred', 'true');
      } else if (currentFolderId !== null) {
        params.append('folder_id', currentFolderId);
      } else {
        currentFiles = [];
        renderFilesUI([]);
        return;
      }

      if (params.toString()) url += `?${params.toString()}`;

      fetch(url)
        .then(r => r.json())
        .then(files => {
          currentFiles = files;
          renderFilesUI(files);
        })
        .catch(() => {});

    function navigateToFolder(id, name) {
      currentFolderId = id;
      currentFolderName = name;
      folderNameDisplay.innerText = name || 'Folder View';
      folderSubHeader.classList.remove('hidden');

    }

    function attachFolderDeleteHandlers() {
      document.querySelectorAll('.btn-delete-folder').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          if (confirm("Delete this folder and its contents?")) {
            fetch(`/folders/${id}`, { method: 'DELETE' })
              .then(() => {
                showToast("Folder deleted", "info");
                loadDriveData();
              });
          }
        };
      });
    }

    function attachFileDeleteHandlers() {
      document.querySelectorAll('.btn-delete-file').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          if (confirm("Delete this file?")) {
            fetch(`/files/${id}`, { method: 'DELETE' })
              .then(() => {
                showToast("File deleted", "info");
                loadDriveData();
              });
          }
        };
      });
    }

    function attachFileStarHandlers() {
      document.querySelectorAll('.btn-star-file').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          fetch(`/files/${id}/star`, { method: 'POST' })
            .then(r => r.json())
            .then(res => {
              if (res.is_starred) {
                showToast("Added to Starred", "success");
              } else {
                showToast("Removed from Starred", "info");
              }
              loadDriveData();
            });
        };

    // Modal Folder Controls
    function closeFolderModal() {
      newFolderModal.classList.add('hidden');
    }

    btnCloseFolderModal.onclick = closeFolderModal;
    btnCancelFolder.onclick = closeFolderModal;

    btnSubmitFolder.onclick = () => {
      const name = folderNameInput.value.trim();
      if (!name) return;

      const fd = new FormData();
      fd.append('name', name);
      if (currentFolderId) fd.append('parent_id', currentFolderId);

      fetch('/folders', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(() => {
          closeFolderModal();
          showToast(`Folder "${name}" created`, 'success');
          loadDriveData();
        })
        .catch(() => showToast('Failed to create folder', 'error'));
    };

    // Parallel Concurrent Chunked Upload Pipeline (20MB Chunks, 2 Parallel Threads)
    fileInput.onchange = () => handleUploadFiles(fileInput.files);

    folderInput.onchange = () => {
      const files = folderInput.files;
      if (!files || files.length === 0) return;

      const folderName = files[0].webkitRelativePath ? files[0].webkitRelativePath.split('/')[0] : 'Uploaded Folder';

      const fd = new FormData();
      fd.append('name', folderName);
      if (currentFolderId) fd.append('parent_id', currentFolderId);

      fetch('/folders', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(res => {
          const newFolderId = res.folder ? res.folder.id : null;
          showToast(`Created folder "${folderName}"`, 'info');
          handleUploadFiles(files, newFolderId);
        })
        .catch(() => handleUploadFiles(files, currentFolderId));
    };

    const CHUNK_SIZE = 15 * 1024 * 1024; // 15 MB chunks
    const CONCURRENCY = 3; // 3 parallel upload threads

    async function handleUploadFiles(files, overrideFolderId = null) {
      if (!files || files.length === 0) return;

      const targetFolderId = (overrideFolderId !== null) ? overrideFolderId : currentFolderId;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        activeUploadsCount++;
        await uploadSingleFileChunked(file, i, targetFolderId);
        activeUploadsCount = Math.max(0, activeUploadsCount - 1);
      }
    }

    function uploadSingleFileChunked(file, fileIndex, targetFolderId) {
      return new Promise((resolve) => {
        const storageKey = `teldrive_resume_${file.name}_${file.size}`;
        let fileUuid = 'uuid_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
        const totalChunks = file.size > 0 ? Math.ceil(file.size / CHUNK_SIZE) : 1;

        let uploadedTgFileIds = new Array(totalChunks);
        const chunkProgress = new Array(totalChunks).fill(0);
        const chunkRetries = new Array(totalChunks).fill(0);

        // Check localStorage for resumable chunk session
        const storedSessionStr = localStorage.getItem(storageKey);
        if (storedSessionStr) {
          try {
            const session = JSON.parse(storedSessionStr);
            if (session.fileUuid && session.totalChunks === totalChunks && Array.isArray(session.uploadedTgFileIds)) {
              fileUuid = session.fileUuid;
              uploadedTgFileIds = session.uploadedTgFileIds;
              showToast(`Resuming upload for "${file.name}"...`, 'info');

              for (let c = 0; c < totalChunks; c++) {
                if (uploadedTgFileIds[c]) {
                  const cSize = (c === totalChunks - 1) ? (file.size - c * CHUNK_SIZE) : CHUNK_SIZE;
                  chunkProgress[c] = cSize;
                }
              }
            }
          } catch (e) {
            localStorage.removeItem(storageKey);
          }
        }

        // Shared queue of unuploaded chunk indexes
        const pendingQueue = [];
        for (let c = 0; c < totalChunks; c++) {
          if (!uploadedTgFileIds[c]) {
            pendingQueue.push(c);
          }
        }

        const activeChunkIndices = new Set();
        let completedChunksCount = uploadedTgFileIds.filter(Boolean).length;
        let isFailed = false;

        const pCardId = `pcard-${Date.now()}-${fileIndex}`;
        const pCard = document.createElement('div');
        pCard.id = pCardId;
        pCard.className = 'glass-panel p-4 rounded-2xl space-y-3 border border-white/10 shadow-xl animate-fade-in relative overflow-hidden';
        pCard.innerHTML = `
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5 overflow-hidden">
              <div class="w-8 h-8 rounded-lg bg-indigo-500/10 flex items-center justify-center text-indigo-400 shrink-0">
                <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h5M20 20v-5h-5M4 9a9 9 0 0114.85-3.36L20 7M4 17l1.15-1.36A9 9 0 0120 15"/></svg>
              </div>
              <div class="overflow-hidden">
                <h4 class="text-xs font-semibold text-slate-100 truncate">${file.name}</h4>
                <div class="flex items-center gap-2 mt-0.5">
                  <p id="bytes-${pCardId}" class="text-[10px] text-slate-400 font-mono">0 B / ${formatSize(file.size)}</p>
                  <span id="status-${pCardId}" class="text-[10px] text-indigo-300 font-sans font-medium bg-indigo-500/10 px-1.5 py-0.5 rounded border border-indigo-500/20 truncate">Preparing...</span>
                </div>
              </div>
            </div>

            <div class="text-right shrink-0">
              <span id="pct-${pCardId}" class="text-base font-bold bg-gradient-to-r from-indigo-300 to-purple-300 bg-clip-text text-transparent font-mono">0%</span>
              <div id="speed-${pCardId}" class="text-[10px] font-medium text-emerald-400 font-mono">0 KB/s</div>
            </div>
          </div>

          <div class="w-full bg-slate-900/80 rounded-full h-2.5 overflow-hidden border border-white/5 p-0.5">
            <div id="bar-${pCardId}" class="bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-400 h-full rounded-full transition-all duration-150 w-0 shadow-sm"></div>
          </div>
        `;
        progressContainer.appendChild(pCard);

        let lastLoadedBytes = chunkProgress.reduce((sum, b) => sum + b, 0);
        let lastTime = Date.now();

        function persistSession() {
          localStorage.setItem(storageKey, JSON.stringify({
            fileUuid,
            totalChunks,
            uploadedTgFileIds
          }));
        }

        function updateGlobalProgress() {
          const totalUploadedBytes = chunkProgress.reduce((sum, bytes) => sum + bytes, 0);
          const overallPercent = file.size > 0 ? Math.min(100, Math.round((totalUploadedBytes / file.size) * 100)) : 100;

          const now = Date.now();
          const timeDiff = (now - lastTime) / 1000;

          if (timeDiff >= 0.3 || totalUploadedBytes === file.size) {
            const loadedDiff = totalUploadedBytes - lastLoadedBytes;
            const bytesPerSec = timeDiff > 0 ? (loadedDiff / timeDiff) : 0;

            const speedEl = document.getElementById(`speed-${pCardId}`);
            if (speedEl) speedEl.innerText = formatSpeed(bytesPerSec);

            lastLoadedBytes = totalUploadedBytes;
            lastTime = now;
          }

          const barEl = document.getElementById(`bar-${pCardId}`);
          if (barEl) barEl.style.width = `${overallPercent}%`;

          const pctEl = document.getElementById(`pct-${pCardId}`);
          if (pctEl) pctEl.innerText = `${overallPercent}%`;

          const bytesEl = document.getElementById(`bytes-${pCardId}`);
          if (bytesEl) bytesEl.innerText = `${formatSize(totalUploadedBytes)} / ${formatSize(file.size)}`;

          // Active status badge
          const statusEl = document.getElementById(`status-${pCardId}`);
          if (statusEl && activeChunkIndices.size > 0) {
            const activeList = Array.from(activeChunkIndices).map(idx => idx + 1).sort((a, b) => a - b);
            const chunkStr = activeList.length > 1 ? `chunks ${activeList.join(', ')}` : `chunk ${activeList[0]}`;
            statusEl.innerText = `Uploading ${chunkStr} of ${totalChunks}...`;
          }
        }

        updateGlobalProgress();

        async function createWorker() {
          while (pendingQueue.length > 0 && !isFailed) {
            const chunkIndex = pendingQueue.shift();
            activeChunkIndices.add(chunkIndex);
            updateGlobalProgress();

            const start = chunkIndex * CHUNK_SIZE;
            const end = Math.min(file.size, start + CHUNK_SIZE);
            const chunkBlob = file.slice(start, end);
            const chunkSize = end - start;

            const formData = new FormData();
            formData.append('file', chunkBlob, file.name);
            formData.append('chunk_index', chunkIndex);
            formData.append('total_chunks', totalChunks);
            formData.append('file_uuid', fileUuid);

            try {
              const response = await new Promise((resXhr, rejXhr) => {
                const xhr = new XMLHttpRequest();
                xhr.upload.onprogress = (e) => {
                  if (e.lengthComputable) {
                    chunkProgress[chunkIndex] = e.loaded;
                    updateGlobalProgress();
                  }
                };
                xhr.onload = () => {
                  if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                      const resData = JSON.parse(xhr.responseText);
                      if (resData.tg_file_id) {
                        resXhr(resData);
                      } else {
                        rejXhr(new Error('Missing file ID'));
                      }
                    } catch (e) {
                      rejXhr(e);
                    }
                  } else {
                    rejXhr(new Error(`HTTP ${xhr.status}`));
                  }
                };
                xhr.onerror = () => rejXhr(new Error('Network error'));
                xhr.open('POST', '/upload-chunk', true);
                xhr.send(formData);
              });

              uploadedTgFileIds[chunkIndex] = response.tg_file_id;
              chunkProgress[chunkIndex] = chunkSize;
              completedChunksCount++;
              persistSession();
            } catch (err) {
              chunkProgress[chunkIndex] = 0;
              chunkRetries[chunkIndex] = (chunkRetries[chunkIndex] || 0) + 1;
              if (chunkRetries[chunkIndex] <= 3) {
                pendingQueue.push(chunkIndex);
              } else {
                handleError(`Chunk ${chunkIndex + 1} failed after 3 retries: ${err.message}`);
                activeChunkIndices.delete(chunkIndex);
                return;
              }
            } finally {
              activeChunkIndices.delete(chunkIndex);
              updateGlobalProgress();
            }
          }

          if (completedChunksCount === totalChunks && activeChunkIndices.size === 0 && !isFailed) {
            saveMetadata();
          }
        }

        function saveMetadata() {
          const statusEl = document.getElementById(`status-${pCardId}`);
          if (statusEl) statusEl.innerText = 'Saving file metadata...';

          const metaFd = new FormData();
          metaFd.append('file_name', file.name);
          metaFd.append('file_uuid', fileUuid);
          metaFd.append('file_size', file.size);
          metaFd.append('total_chunks', totalChunks);
          metaFd.append('chunks', JSON.stringify(uploadedTgFileIds));
          if (targetFolderId !== null) metaFd.append('folder_id', targetFolderId);

          fetch('/save-file-metadata', { method: 'POST', body: metaFd })
            .then(r => r.json())
            .then(res => {
              localStorage.removeItem(storageKey);

              const barEl = document.getElementById(`bar-${pCardId}`);
              if (barEl) barEl.style.width = '100%';
              const pctEl = document.getElementById(`pct-${pCardId}`);
              if (pctEl) pctEl.innerText = '100%';
              const speedEl = document.getElementById(`speed-${pCardId}`);
              if (speedEl) {
                speedEl.innerText = 'Completed';
                speedEl.className = 'text-[10px] font-medium text-emerald-400 font-mono';
              }
              if (statusEl) {
                statusEl.innerText = 'Done!';
                statusEl.className = 'text-[10px] text-emerald-400 font-sans font-medium bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20';
              }

              showToast(`Uploaded "${file.name}"`, 'success');
              setTimeout(() => {
                const card = document.getElementById(pCardId);
                if (card) card.remove();
              }, 1500);
              loadDriveData();
              resolve();
            })
            .catch(() => handleError('Failed to save file metadata'));
        }

        function handleError(msg) {
          if (isFailed) return;
          isFailed = true;
          showToast(`Error: ${msg}`, 'error');
          const speedEl = document.getElementById(`speed-${pCardId}`);
          if (speedEl) {
            speedEl.innerText = 'Failed';
            speedEl.className = 'text-[10px] font-medium text-rose-400 font-mono';
          }
          const statusEl = document.getElementById(`status-${pCardId}`);
          if (statusEl) {
            statusEl.innerText = 'Failed';
            statusEl.className = 'text-[10px] text-rose-400 font-sans font-medium bg-rose-500/10 px-1.5 py-0.5 rounded border border-rose-500/20';
          }
          resolve();
        }

        // Spawn CONCURRENCY workers using Promise.all
        const workers = [];
        const workerCount = Math.min(CONCURRENCY, pendingQueue.length || 1);
        for (let w = 0; w < workerCount; w++) {
          workers.push(createWorker());
        }

        Promise.all(workers).catch(e => handleError(e.message));
      });
    }

    // Search input filtering
    searchInput.oninput = () => {
      currentSearch = searchInput.value.trim();
      if (currentSearch) btnClearSearch.classList.remove('hidden');
      else btnClearSearch.classList.add('hidden');
      loadDriveData();
    };

    btnClearSearch.onclick = () => {
      searchInput.value = '';
      currentSearch = '';
      btnClearSearch.classList.add('hidden');
      loadDriveData();
    };

    // Media Preview Modal Logic
    function getFileExt(filename) {
      return (filename || '').split('.').pop().toLowerCase();
    }

    function getFileTypeCategory(ext) {
      if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp'].includes(ext)) return 'image';
      if (['mp3', 'wav', 'flac', 'm4a', 'ogg', 'aac'].includes(ext)) return 'audio';
      if (['mp4', 'webm', 'mkv', 'mov', 'avi'].includes(ext)) return 'video';
      if (['pdf', 'txt', 'json', 'md', 'html', 'js', 'css', 'py'].includes(ext)) return 'doc';
      return 'other';
    }

    function getFileTypeIcon(ext) {
      const cat = getFileTypeCategory(ext);
      if (cat === 'image') return `<svg class="w-4 h-4 text-pink-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>`;
      if (cat === 'audio') return `<svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-2v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zM9 10l12-2"/></svg>`;
      if (cat === 'video') return `<svg class="w-4 h-4 text-purple-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>`;
      if (cat === 'doc') return `<svg class="w-4 h-4 text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>`;
      return `<svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>`;
    }

    function openMediaPreview(file) {
      const fileName = file.filename || file.file_name;
      const ext = getFileExt(fileName);
      const cat = getFileTypeCategory(ext);
      const previewUrl = `/files/${file.id}/preview`;
      const downloadUrl = `/files/${file.id}/download`;

      previewHeaderTitle.innerText = fileName;
      previewHeaderSub.innerText = `Size: ${formatSize(file.size || file.file_size)} • Type: ${ext.toUpperCase()}`;
      previewHeaderIcon.innerHTML = getFileTypeIcon(ext);
      btnPreviewDownload.href = downloadUrl;

      previewBody.innerHTML = '';

      if (cat === 'image') {
        let zoom = 1;
        previewBody.innerHTML = `
          <div class="flex flex-col items-center justify-center gap-4 w-full h-full relative overflow-hidden">
            <div class="overflow-auto max-h-[68vh] w-full flex items-center justify-center p-2 relative">
              <div id="imgSpinner" class="absolute inset-0 flex items-center justify-center bg-slate-950/60 z-10">
                <svg class="w-8 h-8 animate-spin text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h5M20 20v-5h-5M4 9a9 9 0 0114.85-3.36L20 7M4 17l1.15-1.36A9 9 0 0120 15"/></svg>
              </div>
              <img id="lightboxImg" src="${previewUrl}" class="max-h-[65vh] object-contain rounded-xl shadow-2xl transition-transform duration-200 cursor-zoom-in" style="transform: scale(1)" onload="document.getElementById('imgSpinner').remove()" />
            </div>
            <div class="glass-panel px-3 py-1.5 rounded-full flex items-center gap-3 text-xs border border-white/10">
              <button id="btnZoomOut" class="p-1 hover:text-indigo-400 transition">&minus;</button>
              <span id="zoomVal" class="text-slate-300 font-mono">100%</span>
              <button id="btnZoomIn" class="p-1 hover:text-indigo-400 transition">&plus;</button>
              <button id="btnZoomReset" class="ml-2 text-slate-400 hover:text-white underline">Reset</button>
            </div>
          </div>
        `;
        const img = document.getElementById('lightboxImg');
        const zoomVal = document.getElementById('zoomVal');

        function updateZoom(newZoom) {
          zoom = Math.max(0.5, Math.min(3.5, newZoom));
          img.style.transform = `scale(${zoom})`;
          zoomVal.innerText = `${Math.round(zoom * 100)}%`;
        }

        document.getElementById('btnZoomIn').onclick = () => updateZoom(zoom + 0.25);
        document.getElementById('btnZoomOut').onclick = () => updateZoom(zoom - 0.25);
        document.getElementById('btnZoomReset').onclick = () => updateZoom(1);
        img.onclick = () => updateZoom(zoom === 1 ? 1.8 : 1);

      } else if (cat === 'audio') {
        previewBody.innerHTML = `
          <div class="w-full max-w-md glass-panel p-6 rounded-2xl flex flex-col items-center gap-5 border border-white/10 shadow-2xl">
            <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-amber-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-amber-500/20 animate-pulse">
              <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-2v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zM9 10l12-2"/></svg>
            </div>

            <div class="text-center w-full">
              <h4 class="text-base font-semibold text-white truncate">${fileName}</h4>
              <p class="text-xs text-slate-400">Audio Preview</p>
            </div>

            <audio id="customAudio" src="${previewUrl}" controls autoplay class="w-full accent-amber-500"></audio>
          </div>
        `;
      } else if (cat === 'video') {
        previewBody.innerHTML = `
          <div class="w-full flex items-center justify-center">
            <video controls autoplay class="w-full max-h-[68vh] rounded-xl shadow-2xl bg-black" src="${previewUrl}"></video>
          </div>
        `;
      } else if (cat === 'doc') {
        previewBody.innerHTML = `
          <div class="w-full h-[68vh] rounded-xl overflow-hidden glass-panel border border-white/10">
            <iframe src="${previewUrl}" class="w-full h-full bg-slate-900"></iframe>
          </div>
        `;
      } else {
        previewBody.innerHTML = `
          <div class="glass-panel p-8 rounded-2xl text-center space-y-4 max-w-sm">
            <div class="w-16 h-16 rounded-full bg-indigo-500/10 flex items-center justify-center text-indigo-400 mx-auto">
              ${getFileTypeIcon(ext)}
            </div>
            <div>
              <h4 class="text-base font-semibold text-white">${fileName}</h4>
              <p class="text-xs text-slate-400 mt-1">Direct file preview is not supported for this file type.</p>
            </div>
            <a href="${downloadUrl}" download class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-500/20 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              <span>Download File</span>
            </a>
          </div>
        `;
      }

      previewModal.classList.remove('hidden');
    }

    function closePreviewModal() {
      previewModal.classList.add('hidden');
      previewBody.innerHTML = '';
    }

    btnClosePreview.onclick = closePreviewModal;
    previewModal.onclick = (e) => {
      if (e.target === previewModal) closePreviewModal();
    };

    // Pull to Refresh Touch Gesture
    let ptrStartY = 0;
    let ptrCurrentY = 0;
    let ptrIsPulling = false;
    const ptrIndicator = document.getElementById('ptrIndicator');

    document.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0) {
        ptrStartY = e.touches[0].clientY;
        ptrIsPulling = true;
      }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (!ptrIsPulling) return;
      ptrCurrentY = e.touches[0].clientY;
      const diff = ptrCurrentY - ptrStartY;
      if (diff > 0 && window.scrollY === 0) {
        const pullDistance = Math.min(diff * 0.4, 70);
        ptrIndicator.style.transform = `translate(-50%, ${pullDistance}px)`;
        ptrIndicator.style.opacity = Math.min(pullDistance / 40, 1);
      }
    }, { passive: true });

    document.addEventListener('touchend', () => {
      if (!ptrIsPulling) return;
      ptrIsPulling = false;
      const diff = ptrCurrentY - ptrStartY;
      if (diff 55 && window.scrollY === 0) {
        ptrIndicator.style.transform = 'translate(-50%, 50px)';
        showToast('Refreshing drive...', 'info');
        loadDriveData();
        setTimeout(() => {
          ptrIndicator.style.transform = 'translate(-50%, 0px)';
          ptrIndicator.style.opacity = '0';
        }, 600);
      } else {
        ptrIndicator.style.transform = 'translate(-50%, 0px)';
        ptrIndicator.style.opacity = '0';
      }
      ptrStartY = 0;
      ptrCurrentY = 0;
    });

    // Initialize
    switchTab('files');
  </script>
</body>
</html>
