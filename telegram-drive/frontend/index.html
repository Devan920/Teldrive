<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TelDrive - Virtual Cloud Storage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    };
  </script>
  <style>
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-slide-up {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-modal {
      background: rgba(10, 15, 30, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-indigo-500/30 selection:text-indigo-200 relative overflow-x-hidden flex flex-col" style="padding-top: env(safe-area-inset-top);">

  <!-- Background Glow Accents -->
  <div class="fixed -top-40 -left-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed top-1/3 -right-40 w-96 h-96 bg-purple-600/15 rounded-full blur-3xl pointer-events-none"></div>

  <!-- App Header -->
  <header class="sticky top-0 z-30 glass-panel border-b border-white/10 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 001-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">TelDrive</h1>
        <p class="text-xs text-slate-400">Telegram Cloud Drive</p>
      </div>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-2 sm:gap-3">
      <button id="btnNewFolder" class="bg-indigo-600/80 hover:bg-indigo-500 active:scale-95 text-white text-sm font-medium px-3.5 py-2 rounded-xl border border-indigo-400/30 shadow-lg shadow-indigo-500/20 transition-all flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        <span>+ New Folder</span>
      </button>
      <button id="btnUpload" class="bg-emerald-600/80 hover:bg-emerald-500 active:scale-95 text-white text-sm font-medium px-3.5 py-2 rounded-xl border border-emerald-400/30 shadow-lg shadow-emerald-500/20 transition-all flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        <span>Upload</span>
      </button>
      <input type="file" id="fileInput" multiple class="hidden" />
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-6 space-y-6">

    <!-- Search & Filter Bar -->
    <div class="glass-panel p-3 rounded-2xl flex items-center gap-3">
      <svg class="w-5 h-5 text-slate-400 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search files across drive..." class="flex-1 bg-transparent text-slate-100 placeholder-slate-400 text-sm focus:outline-none" />
      <button id="btnClearSearch" class="hidden text-xs text-slate-400 hover:text-white px-2 py-1 rounded bg-white/5">Clear</button>
    </div>

    <!-- Dropzone Area -->
    <div id="dropzone" class="glass-panel border-2 border-dashed border-slate-700/80 hover:border-indigo-500/50 rounded-2xl p-6 text-center cursor-pointer transition-all duration-300">
      <div class="flex flex-col items-center justify-center gap-2">
        <div class="w-12 h-12 rounded-full bg-indigo-500/10 flex items-center justify-center text-indigo-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
        </div>
        <p class="text-sm text-slate-300 font-medium">Drag & drop files here, or <span class="text-indigo-400 underline">browse</span></p>
        <p class="text-xs text-slate-500">Supports files up to 50MB</p>
      </div>
    </div>
    <div id="progressContainer" class="space-y-2"></div>

    <!-- Breadcrumb Bar -->
    <div class="glass-panel px-4 py-3 rounded-2xl flex items-center justify-between gap-4">
      <div class="flex items-center gap-2 overflow-x-auto text-sm" id="breadcrumbContainer">
        <!-- Breadcrumb nodes inserted dynamically -->
      </div>
      <button id="btnBackFolder" class="hidden text-xs bg-white/5 hover:bg-white/10 text-slate-300 px-3 py-1.5 rounded-lg border border-white/10 flex items-center gap-1 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        <span>Back</span>
      </button>
    </div>

    <!-- Folders Grid Section -->
    <div id="foldersSection" class="space-y-3 hidden">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-1">Folders</h2>
      <div id="foldersGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
        <!-- Folder items rendered dynamically -->
      </div>
    </div>

    <!-- Files Section -->
    <div class="space-y-3">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-1">Files</h2>
      <div id="filesContainer" class="glass-panel rounded-2xl overflow-hidden divide-y divide-white/5">
        <!-- File rows rendered dynamically -->
      </div>
      <div id="emptyFilesState" class="hidden glass-panel rounded-2xl p-12 text-center text-slate-500 text-sm">
        No files found in this folder.
      </div>
    </div>

  </main>

  <!-- Create Folder Modal -->
  <div id="newFolderModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-modal animate-fade-in rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-white/10">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold text-white">Create New Folder</h3>
        <button id="btnCloseFolderModal" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Folder Name</label>
        <input type="text" id="folderNameInput" placeholder="e.g. Work Documents" class="w-full bg-slate-900/80 border border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500/80" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button id="btnCancelFolder" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-white/5 transition">Cancel</button>
        <button id="btnSubmitFolder" class="px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-500/20 transition">Create Folder</button>
      </div>
    </div>
  </div>

  <!-- Full-Featured Media Preview Modal -->
  <div id="previewModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-2xl z-50 flex items-center justify-center p-2 sm:p-6 hidden">
    <div class="glass-modal animate-slide-up rounded-2xl max-w-5xl w-full max-h-[92vh] flex flex-col shadow-2xl border border-white/15 overflow-hidden">

      <!-- Modal Header -->
      <div class="px-5 py-4 border-b border-white/10 flex items-center justify-between gap-4 bg-slate-900/60">
        <div class="flex items-center gap-3 overflow-hidden">
          <div id="previewHeaderIcon" class="w-9 h-9 rounded-lg bg-indigo-500/10 flex items-center justify-center text-indigo-400 shrink-0">
            <!-- Dynamic icon -->
          </div>
          <div class="overflow-hidden">
            <h3 id="previewHeaderTitle" class="text-sm sm:text-base font-semibold text-white truncate">File Name</h3>
            <p id="previewHeaderSub" class="text-xs text-slate-400 truncate">Size: 0 MB</p>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <a id="btnPreviewDownload" href="#" download class="bg-emerald-600/80 hover:bg-emerald-500 active:scale-95 text-white text-xs sm:text-sm font-medium px-3.5 py-2 rounded-xl border border-emerald-400/30 shadow-lg shadow-emerald-500/20 transition-all flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <span class="hidden sm:inline">Download</span>
          </a>
          <button id="btnClosePreview" class="text-slate-400 hover:text-white p-2 rounded-full hover:bg-white/10 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <!-- Modal Content Body -->
      <div id="previewBody" class="flex-1 p-4 sm:p-6 overflow-y-auto flex items-center justify-center min-h-[300px]">
        <!-- Dynamic content: Lightbox / Custom Audio / Video / PDF iFrame / Fallback -->
      </div>
    </div>
  </div>

  <script>
    // State
    let currentFolderId = null;
    let currentSearch = '';
    let currentFiles = [];

    // DOM Elements
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const progressContainer = document.getElementById('progressContainer');
    const filesContainer = document.getElementById('filesContainer');
    const emptyFilesState = document.getElementById('emptyFilesState');
    const foldersSection = document.getElementById('foldersSection');
    const foldersGrid = document.getElementById('foldersGrid');
    const breadcrumbContainer = document.getElementById('breadcrumbContainer');
    const btnBackFolder = document.getElementById('btnBackFolder');
    const searchInput = document.getElementById('searchInput');
    const btnClearSearch = document.getElementById('btnClearSearch');

    // New Folder Modal
    const btnNewFolder = document.getElementById('btnNewFolder');
    const newFolderModal = document.getElementById('newFolderModal');
    const folderNameInput = document.getElementById('folderNameInput');
    const btnCloseFolderModal = document.getElementById('btnCloseFolderModal');
    const btnCancelFolder = document.getElementById('btnCancelFolder');
    const btnSubmitFolder = document.getElementById('btnSubmitFolder');

    // Upload button
    const btnUpload = document.getElementById('btnUpload');

    // Media Preview Modal
    const previewModal = document.getElementById('previewModal');
    const previewBody = document.getElementById('previewBody');
    const previewHeaderIcon = document.getElementById('previewHeaderIcon');
    const previewHeaderTitle = document.getElementById('previewHeaderTitle');
    const previewHeaderSub = document.getElementById('previewHeaderSub');
    const btnPreviewDownload = document.getElementById('btnPreviewDownload');
    const btnClosePreview = document.getElementById('btnClosePreview');

    // Formatters
    function formatSize(bytes) {
      if (!bytes || bytes <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
    }

    // Load Data
    function loadDriveData() {
      loadBreadcrumbs();
      loadFolders();
      loadFiles();
    }

    function loadBreadcrumbs() {
      const url = currentFolderId ? `/breadcrumbs?folder_id=${currentFolderId}` : '/breadcrumbs';
      fetch(url)
        .then(r => r.json())
        .then(crumbs => {
          breadcrumbContainer.innerHTML = '';
          crumbs.forEach((crumb, index) => {
            const isLast = index === crumbs.length - 1;
            const node = document.createElement('div');
            node.className = 'flex items-center gap-1.5';

            if (crumb.id === null) {
              node.innerHTML = `<button onclick="navigateToFolder(null)" class="hover:text-indigo-400 font-medium ${isLast ? 'text-white' : 'text-slate-400'} flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span>Home</span>
              </button>`;
            } else {
              node.innerHTML = `<span class="text-slate-600">/</span>
              <button onclick="navigateToFolder(${crumb.id})" class="hover:text-indigo-400 font-medium ${isLast ? 'text-white font-semibold' : 'text-slate-400'}">
                ${crumb.name}
              </button>`;
            }
            breadcrumbContainer.appendChild(node);
          });

          if (crumbs.length > 1) {
            btnBackFolder.classList.remove('hidden');
            const parentId = crumbs[crumbs.length - 2].id;
            btnBackFolder.onclick = () => navigateToFolder(parentId);
          } else {
            btnBackFolder.classList.add('hidden');
          }
        });
    }

    function loadFolders() {
      if (currentSearch) {
        foldersSection.classList.add('hidden');
        return;
      }

      const url = currentFolderId ? `/folders?parent_id=${currentFolderId}` : '/folders';
      fetch(url)
        .then(r => r.json())
        .then(folders => {
          foldersGrid.innerHTML = '';
          if (folders.length > 0) {
            foldersSection.classList.remove('hidden');
            folders.forEach(f => {
              const card = document.createElement('div');
              card.className = 'glass-panel hover:bg-slate-800/80 rounded-2xl p-3.5 cursor-pointer transition-all duration-200 group relative flex flex-col justify-between gap-2 border border-white/10 hover:border-amber-500/40 hover:shadow-lg hover:shadow-amber-500/10';
              card.onclick = (e) => {
                if (e.target.closest('.btn-delete-folder')) return;
                navigateToFolder(f.id);
              };
              card.innerHTML = `
                <div class="flex items-start justify-between">
                  <div class="w-10 h-10 rounded-xl bg-amber-500/10 flex items-center justify-center text-amber-400 group-hover:scale-105 transition-transform">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
                  </div>
                  <button data-id="${f.id}" class="btn-delete-folder text-slate-500 hover:text-red-400 p-1 rounded-lg hover:bg-white/5 opacity-0 group-hover:opacity-100 transition" title="Delete folder">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                  </button>
                </div>
                <div>
                  <h3 class="text-xs sm:text-sm font-medium text-slate-200 truncate group-hover:text-white">${f.name}</h3>
                  <p class="text-[10px] text-slate-500">Folder</p>
                </div>
              `;
              foldersGrid.appendChild(card);
            });
            attachFolderDeleteHandlers();
          } else {
            foldersSection.classList.add('hidden');
          }
        });
    }

    function loadFiles() {
      let url = '/files';
      const params = new URLSearchParams();
      if (currentSearch) params.append('search', currentSearch);
      else if (currentFolderId) params.append('folder_id', currentFolderId);

      if (params.toString()) url += `?${params.toString()}`;

      fetch(url)
        .then(r => r.json())
        .then(files => {
          currentFiles = files;
          filesContainer.innerHTML = '';
          if (files.length === 0) {
            emptyFilesState.classList.remove('hidden');
          } else {
            emptyFilesState.classList.add('hidden');
            files.forEach(f => {
              const row = document.createElement('div');
              row.className = 'p-3 sm:p-4 hover:bg-white/5 transition flex items-center justify-between gap-4 cursor-pointer group';
              row.onclick = (e) => {
                if (e.target.closest('.file-action')) return;
                openMediaPreview(f);
              };

              const ext = getFileExt(f.filename || f.file_name);
              const iconSvg = getFileTypeIcon(ext);

              row.innerHTML = `
                <div class="flex items-center gap-3 overflow-hidden flex-1">
                  <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-indigo-400 shrink-0 group-hover:scale-105 transition-transform">
                    ${iconSvg}
                  </div>
                  <div class="overflow-hidden">
                    <h4 class="text-sm font-medium text-slate-200 group-hover:text-indigo-300 truncate">${f.filename || f.file_name}</h4>
                    <p class="text-xs text-slate-500">${formatSize(f.size || f.file_size)} • ${new Date(f.uploaded_at).toLocaleDateString()}</p>
                  </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                  <a href="/files/${f.id}/download" download class="file-action p-2 rounded-xl text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10 transition" title="Download">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                  </a>
                  <button data-id="${f.id}" class="file-action btn-delete-file p-2 rounded-xl text-slate-400 hover:text-red-400 hover:bg-red-500/10 transition" title="Delete">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                  </button>
                </div>
              `;
              filesContainer.appendChild(row);
            });
            attachFileDeleteHandlers();
          }
        });
    }

    function navigateToFolder(id) {
      currentFolderId = id;
      loadDriveData();
    }

    function attachFolderDeleteHandlers() {
      document.querySelectorAll('.btn-delete-folder').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          if (confirm("Delete this folder and its contents?")) {
            fetch(`/folders/${id}`, { method: 'DELETE' }).then(() => loadDriveData());
          }
        };
      });
    }

    function attachFileDeleteHandlers() {
      document.querySelectorAll('.btn-delete-file').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          if (confirm("Delete this file?")) {
            fetch(`/files/${id}`, { method: 'DELETE' }).then(() => loadDriveData());
          }
        };
      });
    }

    // Modal Folder Controls
    btnNewFolder.onclick = () => {
      folderNameInput.value = '';
      newFolderModal.classList.remove('hidden');
      folderNameInput.focus();
    };

    function closeFolderModal() {
      newFolderModal.classList.add('hidden');
    }

    btnCloseFolderModal.onclick = closeFolderModal;
    btnCancelFolder.onclick = closeFolderModal;

    btnSubmitFolder.onclick = () => {
      const name = folderNameInput.value.trim();
      if (!name) return;

      const fd = new FormData();
      fd.append('name', name);
      if (currentFolderId) fd.append('parent_id', currentFolderId);

      fetch('/folders', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(() => {
          closeFolderModal();
          loadDriveData();
        });
    };

    // Uploading
    btnUpload.onclick = () => fileInput.click();
    dropzone.onclick = () => fileInput.click();

    fileInput.onchange = () => handleUploadFiles(fileInput.files);

    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('border-indigo-500', 'bg-indigo-500/5'); });
    dropzone.addEventListener('dragleave', () => { dropzone.classList.remove('border-indigo-500', 'bg-indigo-500/5'); });
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('border-indigo-500', 'bg-indigo-500/5');
      handleUploadFiles(e.dataTransfer.files);
    });

    function handleUploadFiles(files) {
      if (!files || files.length === 0) return;
      const formData = new FormData();
      if (currentFolderId) formData.append('folder_id', currentFolderId);

      for (const file of files) {
        formData.append('files', file);
        const pDiv = document.createElement('div');
        pDiv.className = 'glass-panel p-3 rounded-xl flex items-center justify-between text-xs gap-3';
        pDiv.innerHTML = `<span class="truncate text-slate-200">${file.name}</span><span class="text-indigo-400 font-medium shrink-0 animate-pulse">Uploading...</span>`;
        progressContainer.appendChild(pDiv);
      }

      fetch('/upload', { method: 'POST', body: formData })
        .then(r => r.json())
        .then(res => {
          progressContainer.innerHTML = '';
          loadDriveData();
        })
        .catch(() => {
          progressContainer.innerHTML = '';
          alert('Upload failed');
        });
    }

    // Search
    searchInput.oninput = () => {
      currentSearch = searchInput.value.trim();
      if (currentSearch) btnClearSearch.classList.remove('hidden');
      else btnClearSearch.classList.add('hidden');
      loadDriveData();
    };

    btnClearSearch.onclick = () => {
      searchInput.value = '';
      currentSearch = '';
      btnClearSearch.classList.add('hidden');
      loadDriveData();
    };

    // Media Preview Modal Logic
    function getFileExt(filename) {
      return (filename || '').split('.').pop().toLowerCase();
    }

    function getFileTypeCategory(ext) {
      if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp'].includes(ext)) return 'image';
      if (['mp3', 'wav', 'flac', 'm4a', 'ogg', 'aac'].includes(ext)) return 'audio';
      if (['mp4', 'webm', 'mkv', 'mov', 'avi'].includes(ext)) return 'video';
      if (['pdf', 'txt', 'json', 'md', 'html', 'js', 'css', 'py'].includes(ext)) return 'doc';
      return 'other';
    }

    function getFileTypeIcon(ext) {
      const cat = getFileTypeCategory(ext);
      if (cat === 'image') return `<svg class="w-5 h-5 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>`;
      if (cat === 'audio') return `<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-2v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zM9 10l12-2"/></svg>`;
      if (cat === 'video') return `<svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>`;
      if (cat === 'doc') return `<svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>`;
      return `<svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>`;
    }

    function openMediaPreview(file) {
      const fileName = file.filename || file.file_name;
      const ext = getFileExt(fileName);
      const cat = getFileTypeCategory(ext);
      const previewUrl = `/files/${file.id}/preview`;
      const downloadUrl = `/files/${file.id}/download`;

      previewHeaderTitle.innerText = fileName;
      previewHeaderSub.innerText = `Size: ${formatSize(file.size || file.file_size)} • Type: ${ext.toUpperCase()}`;
      previewHeaderIcon.innerHTML = getFileTypeIcon(ext);
      btnPreviewDownload.href = downloadUrl;

      previewBody.innerHTML = '';

      if (cat === 'image') {
        let zoom = 1;
        previewBody.innerHTML = `
          <div class="flex flex-col items-center justify-center gap-4 w-full h-full relative overflow-hidden">
            <div class="overflow-auto max-h-[68vh] w-full flex items-center justify-center p-2">
              <img id="lightboxImg" src="${previewUrl}" class="max-h-[65vh] object-contain rounded-xl shadow-2xl transition-transform duration-200 cursor-zoom-in" style="transform: scale(1)" />
            </div>
            <div class="glass-panel px-3 py-1.5 rounded-full flex items-center gap-3 text-xs border border-white/10">
              <button id="btnZoomOut" class="p-1 hover:text-indigo-400 transition">&minus;</button>
              <span id="zoomVal" class="text-slate-300 font-mono">100%</span>
              <button id="btnZoomIn" class="p-1 hover:text-indigo-400 transition">&plus;</button>
              <button id="btnZoomReset" class="ml-2 text-slate-400 hover:text-white underline">Reset</button>
            </div>
          </div>
        `;
        const img = document.getElementById('lightboxImg');
        const zoomVal = document.getElementById('zoomVal');

        function updateZoom(newZoom) {
          zoom = Math.max(0.5, Math.min(3.5, newZoom));
          img.style.transform = `scale(${zoom})`;
          zoomVal.innerText = `${Math.round(zoom * 100)}%`;
        }

        document.getElementById('btnZoomIn').onclick = () => updateZoom(zoom + 0.25);
        document.getElementById('btnZoomOut').onclick = () => updateZoom(zoom - 0.25);
        document.getElementById('btnZoomReset').onclick = () => updateZoom(1);
        img.onclick = () => updateZoom(zoom === 1 ? 1.8 : 1);

      } else if (cat === 'audio') {
        previewBody.innerHTML = `
          <div class="w-full max-w-md glass-panel p-6 rounded-2xl flex flex-col items-center gap-5 border border-white/10 shadow-2xl">
            <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-amber-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-amber-500/20 animate-pulse">
              <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-2v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zM9 10l12-2"/></svg>
            </div>

            <div class="text-center w-full">
              <h4 class="text-base font-semibold text-white truncate">${fileName}</h4>
              <p class="text-xs text-slate-400">Audio Preview</p>
            </div>

            <audio id="customAudio" src="${previewUrl}" preload="metadata"></audio>

            <!-- Seekbar -->
            <div class="w-full space-y-1">
              <input type="range" id="audioSeek" value="0" max="100" class="w-full accent-amber-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer" />
              <div class="flex justify-between text-[10px] text-slate-400 font-mono">
                <span id="audioCurTime">00:00</span>
                <span id="audioDuration">00:00</span>
              </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-4">
              <button id="btnSeekBack" class="text-slate-400 hover:text-white p-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.334 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8L4.066 11.2z"/></svg>
              </button>
              <button id="btnAudioPlay" class="w-12 h-12 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 flex items-center justify-center font-bold shadow-lg shadow-amber-500/20 transition">
                <svg id="playIcon" class="w-6 h-6 ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11v11.78a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/></svg>
                <svg id="pauseIcon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M5 4h3v12H5V4zm7 0h3v12h-3V4z"/></svg>
              </button>
              <button id="btnSeekFwd" class="text-slate-400 hover:text-white p-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.934 12.8a1 1 0 000-1.6L6.6 7.2A1 1 0 005 8v8a1 1 0 001.6.8l5.334-4zM19.934 12.8a1 1 0 000-1.6l-5.334-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.334-4z"/></svg>
              </button>
            </div>

            <!-- Volume Slider -->
            <div class="flex items-center gap-2 w-full pt-2 border-t border-white/5">
              <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
              <input type="range" id="audioVolume" value="100" max="100" class="w-full accent-amber-500 h-1 bg-slate-800 rounded cursor-pointer" />
            </div>
          </div>
        `;

        const audio = document.getElementById('customAudio');
        const playBtn = document.getElementById('btnAudioPlay');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const seek = document.getElementById('audioSeek');
        const curTime = document.getElementById('audioCurTime');
        const durTime = document.getElementById('audioDuration');
        const vol = document.getElementById('audioVolume');

        function fmtSec(sec) {
          if (isNaN(sec)) return '00:00';
          const m = Math.floor(sec / 60);
          const s = Math.floor(sec % 60);
          return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        playBtn.onclick = () => {
          if (audio.paused) {
            audio.play();
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
          } else {
            audio.pause();
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
          }
        };

        audio.ontimeupdate = () => {
          if (audio.duration) {
            seek.value = (audio.currentTime / audio.duration) * 100;
            curTime.innerText = fmtSec(audio.currentTime);
            durTime.innerText = fmtSec(audio.duration);
          }
        };

        seek.oninput = () => {
          if (audio.duration) {
            audio.currentTime = (seek.value / 100) * audio.duration;
          }
        };

        vol.oninput = () => {
          audio.volume = vol.value / 100;
        };

        document.getElementById('btnSeekBack').onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 10);
        document.getElementById('btnSeekFwd').onclick = () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);

      } else if (cat === 'video') {
        previewBody.innerHTML = `
          <div class="w-full flex items-center justify-center">
            <video controls autoplay class="w-full max-h-[68vh] rounded-xl shadow-2xl bg-black" src="${previewUrl}"></video>
          </div>
        `;
      } else if (cat === 'doc') {
        previewBody.innerHTML = `
          <div class="w-full h-[68vh] rounded-xl overflow-hidden glass-panel border border-white/10">
            <iframe src="${previewUrl}" class="w-full h-full bg-slate-900"></iframe>
          </div>
        `;
      } else {
        previewBody.innerHTML = `
          <div class="glass-panel p-8 rounded-2xl text-center space-y-4 max-w-sm">
            <div class="w-16 h-16 rounded-full bg-indigo-500/10 flex items-center justify-center text-indigo-400 mx-auto">
              ${getFileTypeIcon(ext)}
            </div>
            <div>
              <h4 class="text-base font-semibold text-white">${fileName}</h4>
              <p class="text-xs text-slate-400 mt-1">Direct file preview is not supported for this file type.</p>
            </div>
            <a href="${downloadUrl}" download class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-500/20 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              <span>Download File</span>
            </a>
          </div>
        `;
      }

      previewModal.classList.remove('hidden');
    }

    function closePreviewModal() {
      previewModal.classList.add('hidden');
      previewBody.innerHTML = '';
    }

    btnClosePreview.onclick = closePreviewModal;
    previewModal.onclick = (e) => {
      if (e.target === previewModal) closePreviewModal();
    };

    // Initialize
    loadDriveData();
  </script>
</body>
</html>
